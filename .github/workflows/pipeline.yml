name: Update Predictions

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:       # Manual trigger
    inputs:
      force_refresh:
        description: 'Force re-download all data'
        type: boolean
        default: false
      skip_pymc:
        description: 'Skip PyMC MCMC (faster, PenaltyBlog only)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pipeline/requirements.txt'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run prediction pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pipeline.run_pipeline \
            ${{ github.event.inputs.force_refresh == 'true' && '--force-refresh' || '' }} \
            ${{ github.event.inputs.skip_pymc == 'true' && '--skip-pymc' || '' }}

      - name: Commit predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions/
          git diff --staged --quiet || git commit -m "Update predictions — $(date -u +%Y-%m-%d)"
          git push
