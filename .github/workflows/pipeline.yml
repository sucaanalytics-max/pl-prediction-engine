name: Update Predictions

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:       # Manual trigger
    inputs:
      force_refresh:
        description: 'Force re-download all data'
        type: boolean
        default: false
      skip_pymc:
        description: 'Skip PyMC MCMC (faster, PenaltyBlog only)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: prediction-pipeline
  cancel-in-progress: true

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pipeline/requirements.txt'

      - name: Cache model artifacts
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/processed
          key: pipeline-data-${{ hashFiles('pipeline/requirements.txt') }}-${{ github.run_number }}
          restore-keys: |
            pipeline-data-${{ hashFiles('pipeline/requirements.txt') }}-
            pipeline-data-

      - name: Install dependencies
        run: |
          pip install -r pipeline/requirements.txt
          # Verify critical imports
          python -c "import pandas, numpy, requests; print('Core deps OK')"
          python -c "import penaltyblog; print('PenaltyBlog OK')"
          python -c "
          try:
              import pymc; print('PyMC OK')
          except ImportError:
              print('PyMC UNAVAILABLE — will use PenaltyBlog+XGBoost only')
          "

      - name: Run pipeline contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s pipeline/tests -v

      - name: Run prediction pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PIPELINE_TIMEOUT: "7200"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -m pipeline.run_pipeline \
            ${{ github.event.inputs.force_refresh == 'true' && '--force-refresh' || '' }} \
            ${{ github.event.inputs.skip_pymc == 'true' && '--skip-pymc' || '' }}

      # Placed HERE deliberately: after the pipeline has regenerated the
      # artifacts and before anything publishes or commits them, so a run that
      # produced an unanchored artifact fails instead of committing it.
      #
      # These two test modules are gated on PHASE0_VERIFY_ARTIFACTS because
      # they assert against the COMMITTED predictions/fpl/xp_gw01.json and
      # health.json, which no local checkout can regenerate (pymc, xgboost and
      # sklearn are not installable in every dev environment). Until now the
      # variable was set in no workflow at all, so both simply skipped
      # everywhere and the exit criterion was never checked anywhere.
      #
      # It must NOT be added to "Run pipeline contract tests" above. That step
      # runs BEFORE the pipeline, against the artifact committed by the
      # PREVIOUS run — which today still carries rate_source: null on every
      # fixture. The tests would fail, the job would abort, and the artifact
      # that would have fixed them would never be regenerated: a deadlock the
      # daily job could not recover from on its own.
      # continue-on-error: this gate must NEVER be able to withhold
      # forecast_ledger.json. Neither "Sync predictions to frontend" nor
      # "Commit predictions" below has an `if:`, so without this the gate
      # aborts the job before anything commits — including the ledger, the
      # ONLY artifact that proves a prediction predated kickoff. A seal is
      # irrecoverable; a red run that still publishes is recoverable.
      - name: Verify Phase 0 artifacts
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
          PHASE0_VERIFY_ARTIFACTS: "1"
        run: |
          python -m unittest \
            pipeline.tests.test_xp_artifact_rate_source \
            pipeline.tests.test_health_provenance

      - name: Sync predictions to frontend
        run: |
          set -euo pipefail
          mkdir -p frontend/public/predictions
          # Explicit lists, not `cp predictions/*.json`. A glob silently
          # publishes every new artifact the pipeline learns to write —
          # including forecast_ledger.json, which grows all season and belongs
          # in predictions/ only.
          #
          # REQUIRED: step 10 always writes these, so an absent one is a real
          # failure and must stop the run rather than publish a stale copy.
          for f in latest.json matches.json player_stats.json health.json table.json h2h.json; do
            cp "predictions/$f" "frontend/public/predictions/$f"
          done
          # OPTIONAL: written by a best-effort step, or by a harness run by hand.
          # `cp` under `set -e` would turn a deliberately non-fatal absence into a
          # hard pipeline failure — fixture_xg's export is wrapped in a try/except
          # that logs "FPL agent will use fallback rates" precisely so a bad odds
          # response cannot stop a run, and market_blend_weight is written only by
          # fit_market_blend.py, which nothing in the pipeline may import.
          for f in fixture_xg.json market_blend_weight.json; do
            if [ -f "predictions/$f" ]; then
              cp "predictions/$f" "frontend/public/predictions/$f"
            else
              echo "::notice::optional artifact $f is absent; not published"
            fi
          done

      - name: Commit predictions
        env:
          # Path ownership keeps two writers to main safe, and OWNERSHIP FOLLOWS
          # PRODUCTION. This job produces the xp artifact — it holds the models
          # and the blended goal rates — so it commits it. The agent owns only
          # what it produces: the ledger and the decision.
          #
          # The previous split forbade this job from committing its own output
          # while still writing it into the tree, which left the worktree
          # permanently dirty and made `git pull --rebase` refuse outright. From
          # the second agent-managed gameweek onward nothing was publishable at
          # all — including forecast_ledger.json, the one artifact that proves a
          # prediction predated kickoff.
          FORBID_PATHS: '^predictions/fpl/(ledger|decision|hub)'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          .github/scripts/commit_and_push.sh \
            "Update predictions — $(date -u +%Y-%m-%d)" \
            predictions \
            ':(exclude)predictions/fpl/ledger' \
            ':(exclude)predictions/fpl/decision_gw*.json' \
            ':(exclude)predictions/fpl/hub' \
            frontend/public/predictions

      # The frontend suite reads the artifacts this job just published, and it is the
      # ONLY thing that checks their shape. It cannot be triggered by the commit
      # above: GitHub does not run workflows for pushes made with the default
      # GITHUB_TOKEN, so a bot artifact commit fires nothing regardless of any path
      # filter. Narrowing frontend.yml's excluded paths did not fix that, because
      # there was never a trigger to reach.
      #
      # So the producer verifies its own consumer. Three real breakages went
      # unnoticed for days this way — hardcoded counts in evidence-allclear, a form
      # column that became a measurement when the season started, and a clock that
      # began reading "passed" — each of which this step would have caught the
      # morning it happened.
      #
      # Deliberately AFTER the push, and continue-on-error. A frontend failure must
      # report red without withholding the prediction commit the pages depend on:
      # this repo's own rule is that a red run which still publishes is recoverable,
      # and a green run that publishes nothing is not.
      # Set up here rather than at the top of the job: the pipeline itself is pure
      # Python and a PyMC run takes a long time, so there is no reason to hold a
      # Node toolchain for it. Same version and cache key as frontend.yml, so the
      # two agree about what "the frontend suite passes" means.
      - name: Set up Node for the frontend check
        if: always()
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Verify the frontend still reads what we published
        if: always()
        continue-on-error: true
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit
          npm test
