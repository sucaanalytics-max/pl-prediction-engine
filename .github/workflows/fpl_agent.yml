name: FPL Agent

# Two jobs on purpose.
#
# `decide` is standard library only — no pip install, no dependency cache — so
# it starts in seconds and costs almost nothing. It runs on every cron tick and
# answers one question: is there anything outstanding? Installing pandas, PyMC
# and xgboost just to learn "no" would cost far more than the work being
# guarded, several times a day, all year.
#
# `work` carries the real dependencies and runs only when `decide` says so.
#
# The phase comes from STATE, not from the clock: a failed cron or a queued
# runner must not lose a gameweek. At 38 observations a season, each loss is
# permanent — and a seal in particular can never be recovered, because its whole
# value is that it provably predated the deadline.

on:
  schedule:
    # Every three hours. Deadlines move, so the agent checks in regularly and
    # the phase logic decides what is actually due.
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Produce and notify without sealing'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: fpl-agent
  # Never cancel in flight. A cancelled run between writing an artifact and
  # committing it is exactly how a gameweek gets half-recorded.
  cancel-in-progress: false

jobs:
  decide:
    name: Decide phase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      phase: ${{ steps.phase.outputs.phase }}
      needs_work: ${{ steps.phase.outputs.needs_work }}
      gameweek: ${{ steps.phase.outputs.gameweek }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Deliberately no cache and no install. If this step ever needs one,
          # the stdlib-only constraint on schedule.py has been broken and the
          # test that enforces it should have failed first.

      - name: Resolve phase
        id: phase
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pipeline.learning.schedule

      # Committed from THIS job, which always runs, and never from the agent job,
      # which is skipped whenever nothing is due. That is the entire point: the
      # agent writes evidence_view.json, messages.json and xp_gw*, so all three are
      # absent for the ~10 days before a deadline. Until this file existed the
      # screens could not tell "the agent is idle by design" from "the agent is
      # broken", and they render very differently.
      - name: Publish the agent status
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Written by the resolver above; this just persists it.
          if git diff --quiet -- frontend/public/predictions/fpl/agent_status.json; then
            echo "status unchanged"
            exit 0
          fi
          git add -- frontend/public/predictions/fpl/agent_status.json
          git commit -q -m "Agent status — ${{ steps.phase.outputs.phase }} GW${{ steps.phase.outputs.gameweek }}"
          git pull --rebase --autostash --quiet origin main
          git push --quiet origin main

      - name: Summary
        run: |
          echo "phase=${{ steps.phase.outputs.phase }}" >> "$GITHUB_STEP_SUMMARY"
          echo "gameweek=${{ steps.phase.outputs.gameweek }}" >> "$GITHUB_STEP_SUMMARY"
          echo "needs_work=${{ steps.phase.outputs.needs_work }}" >> "$GITHUB_STEP_SUMMARY"

  work:
    name: Run agent
    needs: decide
    if: needs.decide.outputs.needs_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      # No actions/cache over data/ here, unlike the daily pipeline. Its restore
      # key has no run pin, so it can hand back an arbitrarily old bootstrap —
      # and on deadline day that would produce a sealed forecast built on stale
      # prices and stale availability, with nothing in the record revealing it.
      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run agent
        env:
          PYTHONPATH: ${{ github.workspace }}
          FPL_AGENT_PHASE: ${{ needs.decide.outputs.phase }}
          FPL_AGENT_GAMEWEEK: ${{ needs.decide.outputs.gameweek }}
          FPL_AGENT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FPL_SITE_URL: ${{ secrets.FPL_SITE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pipeline.learning.run_agent

      - name: Commit agent artifacts
        env:
          # Path ownership is what lets this job and the daily pipeline both
          # write to main without serialising a deadline-sensitive seal behind a
          # 180-minute PyMC run. Git rebases at file granularity, so writers on
          # disjoint paths cannot conflict. This job owns predictions/fpl/** and
          # nothing else.
          #
          # POSIX ERE, not PCRE: commit_and_push.sh uses `grep -E`, which has no
          # negative lookahead. So this enumerates the daily job's territory
          # rather than expressing "anything but ours".
          # This ENUMERATES the daily job's territory rather than trying to
          # express "all of frontend except ours". POSIX ERE has no negative
          # lookahead, and the attempt to fake one with character classes let
          # frontend/package.json through — [^p] cannot exclude a directory whose
          # name begins with p.
          #
          # The real control on what gets staged is the explicit path list passed
          # to commit_and_push.sh below; this is the safety net that stops those
          # paths ever overlapping the daily pipeline's files. The agent needs
          # frontend/public/predictions/fpl/ because that is where its message
          # feed is served from — without it the feed was written to the runner
          # and discarded, leaving the agent with no channel at all in CI.
          FORBID_PATHS: '^(predictions/[^/]+\.json|predictions/archive/|predictions/fpl/(xp_gw|sim_params)|frontend/public/predictions/[^/]+\.json|frontend/public/predictions/(archive|h2h-events)/)'
          # Interpolated into env rather than straight into the run: block.
          # These come from our own script's GITHUB_OUTPUT rather than from
          # event data, so injection is not the live risk — but a shell-quoted
          # variable costs nothing and survives a future change to that script.
          AGENT_PHASE: ${{ needs.decide.outputs.phase }}
          AGENT_GAMEWEEK: ${{ needs.decide.outputs.gameweek }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          .github/scripts/commit_and_push.sh \
            "FPL agent — ${AGENT_PHASE} GW${AGENT_GAMEWEEK}" \
            predictions/fpl/ledger \
            predictions/fpl/decision_gw*.json \
            predictions/fpl/messages.json \
            predictions/fpl/field_observations.jsonl \
            predictions/fpl/params.jsonl \
            predictions/fpl/availability_evidence.jsonl \
            frontend/public/predictions/fpl
