name: Frontend CI

# The exclusion below is narrowed to `fpl/**` rather than all of
# `frontend/public/predictions/**`, and the reason is a bug this repo actually
# shipped. `real-artifacts.test.ts` asserts the narrowers lose no rows, reading its
# expected count from the committed artifact. When the pipeline began writing
# player_stats.json as a `{generated_at, players}` envelope instead of a bare list,
# the expected length became `undefined`, the assertion compared 592 against
# nothing, and the suite stayed green for hours — because the commit that changed
# the shape touched only excluded paths, so this workflow never ran on it. The
# frontend suite is the only thing that reads those shapes, and it was blind to
# them changing.
#
# IMPORTANT, and I had this wrong when I made the change: narrowing does NOT make
# the daily pipeline's artifact commits run this workflow. GitHub does not trigger
# workflows for pushes made with the default GITHUB_TOKEN, so a bot commit fires
# nothing whatever the path filter says. The artifact-shape check lives in
# pipeline.yml instead, as a step the producer runs on itself. What narrowing DOES
# buy is coverage when a human pushes a top-level artifact by hand.
#
# Narrowing is still safe because the high-frequency writers are FORBIDDEN from the
# paths this now watches, structurally rather than by convention: news.yml:90 and
# fpl_agent.yml:198 both list `frontend/public/predictions/[^/]+\.json` in
# FORBID_PATHS and commit_and_push.sh exits 1 on a match. So the ~96 daily news
# commits and 24 hourly agent commits stay under `fpl/**` and still do not trigger
# CI, while the daily pipeline and weekly validation — the two writers that can
# change a shape the frontend narrows — now do.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - '!frontend/public/predictions/fpl/**'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - '!frontend/public/predictions/fpl/**'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Matches the Node version Vercel builds with (24.x)
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build
