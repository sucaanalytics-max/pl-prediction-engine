name: Weekly Model Validation

on:
  schedule:
    - cron: '0 10 * * 0'  # Sundays at 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prediction-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pipeline/requirements.txt'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run validation
        env:
          PYTHONPATH: ${{ github.workspace }}
          # The weekly job runs the full suite, including the multi-minute
          # walk-forward backtests. The daily job runs the fast selection only,
          # so a slow or newly flaky FPL test can never block the prediction
          # commit that the betting pages depend on.
          FPL_SLOW_TESTS: "1"
        run: |
          python -m unittest discover -s pipeline/tests -v
          python -m pipeline.validation.run_validation

      - name: Commit health metrics
        env:
          FORBID_PATHS: '^(predictions|frontend/public/predictions)/fpl/'
        run: |
          set -euo pipefail
          cp predictions/health.json frontend/public/predictions/health.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Previously an unretried `git pull --rebase && git push`, which fails
          # the whole weekly run whenever the daily job pushes concurrently.
          .github/scripts/commit_and_push.sh \
            "Update model health — $(date -u +%Y-%m-%d)" \
            predictions/health.json frontend/public/predictions/health.json
