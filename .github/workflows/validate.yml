name: Weekly Model Validation

on:
  schedule:
    - cron: '0 10 * * 0'  # Sundays at 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pipeline/requirements.txt'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run validation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "
          import json, logging
          from pipeline.data.football_data import load_all_seasons
          from pipeline.validation.metrics import brier_score, expected_calibration_error
          import numpy as np

          logging.basicConfig(level=logging.INFO)

          # Load predictions and actuals
          try:
              with open('predictions/latest.json') as f:
                  preds = json.load(f)
              print(f'Loaded {len(preds.get(\"predictions\", []))} predictions')
              print(f'Gameweek: {preds.get(\"metadata\", {}).get(\"gameweek\")}')

              health = {
                  'last_updated': preds.get('metadata', {}).get('generated_at'),
                  'gameweek': preds.get('metadata', {}).get('gameweek'),
                  'n_predictions': len(preds.get('predictions', [])),
                  'status': 'healthy',
              }

              with open('predictions/health.json', 'w') as f:
                  json.dump(health, f, indent=2)

              print('Health check passed')
          except Exception as e:
              print(f'Validation error: {e}')
              health = {'status': 'error', 'error': str(e)}
              with open('predictions/health.json', 'w') as f:
                  json.dump(health, f, indent=2)
          "

      - name: Commit health metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions/health.json
          git diff --staged --quiet || git commit -m "Update model health — $(date -u +%Y-%m-%d)"
          git push
